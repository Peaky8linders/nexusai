name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexusai/package-lock.json
      - run: npm ci
        working-directory: nexusai
      - run: npx tsc --noEmit
        working-directory: nexusai
      - run: npx vite build
        working-directory: nexusai

  backend:
    name: Backend (Rust + Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nexusai/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('nexusai/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexusai/package-lock.json
      - run: npm ci
        working-directory: nexusai
      - run: npx vite build
        working-directory: nexusai
      - run: cargo check
        working-directory: nexusai/src-tauri
